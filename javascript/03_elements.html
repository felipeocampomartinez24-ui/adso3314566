<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02-comments | JavaScript</title>
    
    <style>
        section {
            ul {
                padding: 0;
            }
            ul li,
            figure.animal {
                background-color: #0006;
                border-radius: 2px;
                height: 25px;
                margin: 2px auto;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 25px;
                zoom: 2.5;
            }
        }
    </style>
</head>

<body>
    <!-- Botón para regresar al menú principal de JS -->
    <a href="./index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z"></path>
        </svg>
    </a>

    <section>
        <h3>Get Element By Id:</h3>
        <h4 id="year"></h4>
        <h3>Get Elements By Tag Name:</h3>
        <ul>
            <li>🍎</li>
            <li>🫐</li>
            <li>🍊</li>
            <li>🍒</li>
        </ul>
        <h4></h4>
        <h3>Get Elements By Class Name</h3>
        <p class="paragraph">Lorem ipsum dolor</p>
        <p class="paragraph">Lorem ipsum dolor</p>
        <p class="paragraph">Lorem ipsum dolor</p>
        <h3>Query Selector & Query Selector All</h3>
        <figure class="animal first">🦊</figure>
        <figure class="animal">🐼</figure>
        <figure class="animal">🐷</figure>
    </section>

<script>
    // Get Element By Id
    const year = document.getElementById('year');
    const ndate = new Date();
    year.textContent = `${ndate.getFullYear()}`;

    // Get Elements By Tag Name
    const fruits = document.getElementsByTagName('li');
    const h4s = document.getElementsByTagName('h4');
    h4s[1].textContent = `There are ${fruits.length} fruits. `;
    h4s[1].innerHTML += `The last fruit is ${fruits[fruits.length - 1].textContent}. `;
    h4s[1].innerHTML += `The first fruit is ${fruits[0].textContent}.`;

    // Get Elements By Class Name
    const ps = document.getElementsByClassName('paragraph');
    ps[1].textContent = 'New text value';
    ps[1].style.backgroundColor = 'crimson';
    ps[1].style.color = 'white';
    ps[1].style.padding = '0.4rem';

    // Query Selector & Query Selector All
    const first = document.querySelector('figure.animal');
    first.style.backgroundColor = 'orange';

    const animals = document.querySelectorAll('figure');
    animals.forEach(element => {
        element.style.borderRadius = '50%';
    });
</script>
</body>
</html>
