<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02-comments | JavaScript</title>
    <link rel="stylesheet" href="../../src/css/styles.css">
    
    <style>
       
        table.operators {
            border-collapse: collapse;
            font-size: 0.8rem;
            margin: 40px auto;
            width: 380px;
        }
        table thead th {
            background-color: #f0db4f;
            color: #000c;
        }
        table th,
        table td {
            background-color: #fffc;
            border: 1px solid #333;
            color: #333;
            padding: 6px;
        }
        table thead input {
            border: none;
            border-radius: 20px;
            outline: none;
            padding: 8px;
            width: 120px;
        }
        table tbody td:first-child {
            font-size: 1rem;
            text-align: center;
        }
        table tbody tr:nth-child(even) td {
            background-color: #fff8;
        }

    </style>
</head>

<body>
    <!-- Botón para regresar al menú principal de JS -->
    <a href="/javascript/index_javascript.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z">
            </path>
        </svg>
    </a>

   <section>
            <table class="operators">
                <thead>
                    <tr>
                        <th colspan="5">
                            <input type="number" placeholder="Y Value">
                        </th>
                    </tr>
                    <tr>
                        <th>Operator</th>
                        <th>Description</th>
                        <th>Example</th>
                        <th>Y</th>
                        <th>X</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>+</td>
                        <td>Addition</td>
                        <td>x=y+2</td>
                        <td class="ry"></td>
                        <td class="rx"></td>
                    </tr>
                    <tr>
                        <td>-</td>
                        <td>Substraction</td>
                        <td>x=y-2</td>
                        <td class="ry"></td>
                        <td class="rx"></td>
                    </tr>
                    <tr>
                        <td>*</td>
                        <td>Product</td>
                        <td>x=y*2</td>
                        <td class="ry"></td>
                        <td class="rx"></td>
                    </tr>
                    <tr>
                        <td>/</td>
                        <td>Division</td>
                        <td>x=y/2</td>
                        <td class="ry"></td>
                        <td class="rx"></td>
                    </tr>
                    <tr>
                        <td>%</td>
                        <td>Modulus</td>
                        <td>x=y%2</td>
                        <td class="ry"></td>
                        <td class="rx"></td>
                    </tr>
                    <tr>
                        <td>++</td>
                        <td>Increment(pre)</td>
                        <td>x=++y</td>
                        <td class="ry"></td>
                        <td class="rx"></td>
                    </tr>
                    <tr>
                        <td>++</td>
                        <td>Increment(post)</td>
                        <td>x=y++</td>
                        <td class="ry"></td>
                        <td class="rx"></td>
                    </tr>
                    <tr>
                        <td>--</td>
                        <td>Decrement(pre)</td>
                        <td>x=--y</td>
                        <td class="ry"></td>
                        <td class="rx"></td>
                    </tr>
                    <tr>
                        <td>--</td>
                        <td>Decrement(post)</td>
                        <td>x=y--</td>
                        <td class="ry"></td>
                        <td class="rx"></td>
                    </tr>
                </tbody>
            </table>
        </section>
        <script>
        // results
        const ry    = document.querySelectorAll('td.ry')
        const rx    = document.querySelectorAll('td.rx')
        const input = document.querySelector('input')
        // Events
        input.oninput = () => {
            if (input.value != '') {
                if (input.value.length < 4) {
                    // Adition +
                    ry[0].innerText = parseInt(input.value)
                    rx[0].innerText = parseInt(input.value) + 2
                    // Substraction -
                    ry[1].innerText = parseInt(input.value)
                    rx[1].innerText = parseInt(input.value) - 2
                    // Product *
                    ry[2].innerText = parseInt(input.value)
                    rx[2].innerText = parseInt(input.value) * 2
                    // Division /
                    ry[3].innerText = parseInt(input.value)
                    rx[3].innerText = parseInt(input.value) / 2
                    // Modulus %
                    ry[4].innerText = parseInt(input.value)
                    rx[4].innerText = parseInt(input.value) % 2
                    // Increment(pre) ++
                    let y = parseInt(input.value)
                    ry[5].innerText = ++y
                    rx[5].innerText = y
                    // Increment(post) ++
                    y = parseInt(input.value)
                    ry[6].innerText = y++
                    rx[6].innerText = y
                    // Decrement(pre) --
                    y = parseInt(input.value)
                    ry[7].innerText = --y
                    rx[7].innerText = y
                    // Decrement(post) --
                    y = parseInt(input.value)
                    ry[8].innerText = y--
                    rx[8].innerText = y
                } else {
                    input.value = input.value.slice(0,-1)
                }
            } else {
                for (let i = 0; i < ry.length; i++) {
                    ry[i].innerText = ''
                    rx[i].innerText = ''
                }
            }
        }
    </script>
</body>
</html>
