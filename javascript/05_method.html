<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05-methods-object</title>
    <link rel="stylesheet" href="/04-javascript/css/js.css">
    <link rel="stylesheet" href="css/animate.min.css">
    <style>
        main section h3.pk-name {
            font-size: 2rem;
            text-align: center;
        }
        main section h4 {
            background-color: #fff9;
            color: #0009;
            border-radius: 4px;
            text-align: center;
            font-size: 1.6rem;
            margin: 0 auto;
            padding: 0.4rem 1rem;
            width: fit-content;
        }

        main section figure {
            background-repeat: no-repeat;
            padding: 0;
            display: flex;
            justify-content: center;
            margin: 0 auto;
            height: 192px;
            width: 202px;
        }
        main section figure.alive {
            background-position-x: 0px;
        }
        main section figure.attack {
            background-position-x: -202px;
        }
        main section figure.feed {
            background-position-x: -404px;
        }
        main section figure.dead {
            background-position-x: -608px;
        }
        main section div.actions {
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            width: 150px;
            button {
                background: #fff9;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                padding: 0.4rem 1rem;
                transition: transform 0.2s ease-in;
                &:hover {
                    transform: scale(1.2);
                }
                &:disabled {
                    opacity: 0.5;
                    cursor: not-allowed;
                    transform: none;
                }
            }
        }
    </style>
</head>

<body>
    <a href="/04-javascript/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z">
            </path>
        </svg>
    </a>
    <main>
        <header>
            <h1 id="h1_1">05 Methods Object</h1>
            <h2>Use methods to interact with objects.</h2>
        </header>
        <section>
            <h3 class="pk-name"></h3>
            <h4 class="pk-hp"></h4>
            <figure class="pk-image animate__animated"></figure>
            <div class="actions">
                <button class="btn-attack">Attack 👊🏻</button>
                <button class="btn-feed">Feed 🥞</button>
            </div>
        </section>
    </main>
    <script>
        const pkName = document.querySelector('.pk-name');
        const pkHp = document.querySelector('.pk-hp');
        const pkImage = document.querySelector('.pk-image');

        const btnAttack = document.querySelector('.btn-attack');
        const btnFeed = document.querySelector('.btn-feed');

        //Attributes
        const pokemon = {
            name: 'Snorlax',
            type: 'Normal',
            hp: 100,
            image: 'imgs/snorlax-sprite.png',
            status: 'alive',
            //Methods
            render: function() {
                pkName.innerHTML = `${this.name} <small>${this.type}</small>`;
                pkImage.style.backgroundImage = `url(${this.image})`;
                this.updateHp('animate__rubberBand');
            },

            updateHp: function(fx) {
                pkHp.innerHTML = `HP: ${this.hp}`;
                pkImage.classList.add(this.status);
                if (fx) {
                    pkImage.classList.add(fx);
                }
                this.updateStatus();
            },

            disableButtons: function() {
                btnAttack.disabled = true;
                btnFeed.disabled = true;
                setTimeout(() => {
                    if (this.hp > 0) {
                        btnAttack.disabled = false;
                        btnFeed.disabled = false;
                    }
                }, 1200);
            },

            feed: function() {
                if(this.hp > 0 && this.hp < 200){
                    this.disableButtons();
                    this.hp += 25;
                    this.status = 'feed';
                    pkImage.classList.remove('alive', 'attack', 'dead');
                    this.updateHp('animate__rubberBand');
                }
            },
            attack: function() {
                if(this.hp > 0) {
                    this.disableButtons();
                    this.hp -= 25;
                    
                    if (this.hp <= 0) {
                        this.hp = 0;
                        this.status = 'dead';
                        pkImage.classList.remove('alive', 'attack', 'feed');
                        this.updateHp('animate__shakeX');
                        btnAttack.disabled = true;
                        btnFeed.disabled = true;
                    } else {
                        this.status = 'attack';
                        pkImage.classList.remove('alive', 'feed', 'dead');
                        this.updateHp('animate__rubberBand');
                    }
                }
            },

            updateStatus: function(){
                setTimeout(() => {
                    pkImage.classList.remove('animate__rubberBand', 'animate__shakeX');
                }, 1200);
            }
        };

        pokemon.render();

        // Events
        btnFeed.addEventListener('click', function() {
            pokemon.feed();
        });
        btnAttack.addEventListener('click', function() {
            pokemon.attack();
        });
    </script>
</body>

</html>
