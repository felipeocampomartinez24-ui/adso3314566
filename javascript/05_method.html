<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05 - Refactorización y Orientación a Objetos</title>
    <link rel="stylesheet" href="/css/03_style.css">
    <link rel="stylesheet" href="animate.min.css">
    <style>
        main section h3.pk-name {
            font-size: 2rem;
            text-align: center;
        }
        main section h4 {
            background-color: #fff9;
            color: #0009;
            border-radius: 4px;
            text-align: center;
            font-size: 1.6rem;
            margin: 0 auto;
            padding: 0.4rem 1rem;
            width: fit-content;
        }
        main section figure {
            background-repeat: no-repeat;
            padding: 0;
            display: flex;
            justify-content: center;
            margin: 0 auto;
            height: 192px;
            width: 202px;
        }
        main section figure.alive {
            background-position-x: 0px;
        }
        main section figure.attack {
            background-position-x: -202px;
        }
        main section figure.feed {
            background-position-x: -404px;
        }
        main section figure.dead {
            background-position-x: -608px;
        }
        main section div.actions {
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            width: 150px;
        }
        main section div.actions button {
            background: #fff9;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 0.4rem 1rem;
            transition: transform 0.2s ease-in;
        }
        main section div.actions button:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <a class="btn-home" href="/javascript/index_javascript.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>05 Methods Object - Refactorizado</h1>
            <h2>Controlador Orientado a Objetos para Interacción UI</h2>
        </header>
        <section>
            <h3 class="pk-name"></h3>
            <h4 class="pk-hp"></h4>
            <figure class="pk-image animate__animated"></figure>
            <div class="actions">
                <button class="btn-attack">Atacar</button>
                <button class="btn-feed">Alimentar</button>
            </div>
        </section>
    </main>

    <script>
        /**
         * @class VirtualPetController
         * @description Gestiona el estado reactivo, la interfaz de usuario y las acciones de una criatura interactiva.
         */
        class VirtualPetController {
            /**
             * @constructor
             * @param {Object} creatureData - Datos iniciales de la criatura.
             */
            constructor(creatureData) {
                // Estado interno del modelo
                this.name = creatureData.name;
                this.type = creatureData.type;
                this.hp = creatureData.hp;
                this.imagePath = creatureData.imagePath;
                this.status = creatureData.status;

                // Caché centralizada de elementos del DOM
                this.domElements = {
                    nameContainer: document.querySelector('.pk-name'),
                    hpContainer: document.querySelector('.pk-hp'),
                    spriteContainer: document.querySelector('.pk-image'),
                    attackBtn: document.querySelector('.btn-attack'),
                    feedBtn: document.querySelector('.btn-feed')
                };

                // Inicializar la aplicación
                this.init();
            }

            /**
             * Inicializa la representación visual y configura los escuchadores de eventos.
             */
            init() {
                this.render();
                this.bindEvents();
            }

            /**
             * Actualiza la interfaz gráfica con los valores actuales del estado.
             * @param {string} [animationEffect=''] - Efecto de animación opcional de Animate.css.
             */
            render(animationEffect = '') {
                // Renderizar nombre y tipo
                this.domElements.nameContainer.innerHTML = `${this.name} <small>[${this.type}]</small>`;
                
                // Renderizar imagen de fondo del sprite
                this.domElements.spriteContainer.style.backgroundImage = `url(${this.imagePath})`;
                
                // Renderizar puntos de salud (HP)
                this.domElements.hpContainer.innerHTML = `HP: ${this.hp}`;

                // Limpiar estados anteriores y asignar clases correspondientes
                this.domElements.spriteContainer.classList.remove('alive', 'attack', 'feed', 'dead');
                this.domElements.spriteContainer.classList.add(this.status);

                // Aplicar animación temporal si se especifica
                if (animationEffect) {
                    this.domElements.spriteContainer.classList.add(animationEffect);
                    this.scheduleAnimationReset();
                }
            }

            /**
             * Incrementa los puntos de salud de la criatura al alimentarla.
             */
            nourish() {
                if (this.hp < 200) {
                    this.hp += 25;
                }
                this.status = 'feed';
                this.render('animate__rubberBand');
            }

            /**
             * Reduce los puntos de salud de la criatura al recibir un ataque.
             */
            inflictDamage() {
                if (this.hp > 0) {
                    this.hp -= 25;
                }
                this.status = 'attack';
                this.render('animate__rubberBand');
            }

            /**
             * Remueve de forma temporal la clase de animación transcurrido un intervalo de tiempo.
             */
            scheduleAnimationReset() {
                setTimeout(() => {
                    this.domElements.spriteContainer.classList.remove('animate__rubberBand');
                }, 1200);
            }

            /**
             * Enlaza los eventos de interacción del usuario con los controles de la interfaz.
             */
            bindEvents() {
                // Evento para el botón de alimentar con bloqueo de interacción (debounce visual)
                this.domElements.feedBtn.addEventListener('click', (event) => {
                    this.nourish();
                    const button = event.currentTarget;
                    
                    button.style.pointerEvents = 'none';
                    button.style.opacity = '0.2';
                    
                    setTimeout(() => {
                        button.style.pointerEvents = 'all';
                        button.style.opacity = '1';
                    }, 1200);
                });

                // Evento para el botón de atacar
                this.domElements.attackBtn.addEventListener('click', () => {
                    this.inflictDamage();
                });
            }
        }

        // Instanciación del controlador con un conjunto de datos iniciales
        document.addEventListener('DOMContentLoaded', () => {
            const snorlaxInstance = new VirtualPetController({
                name: 'Snorlax',
                type: 'Normal',
                hp: 100,
                imagePath: './img_j.s/snorlax-sprite.png',
                status: 'alive'
            });
        });
    </script>
</body>
</html>
