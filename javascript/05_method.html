<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05_method</title>
    <link rel="stylesheet" href="css.js/animate.min.css">
    <link rel="stylesheet" href="/javascript/css.js/styles.css">
    <style>
        main section h3.pk-name {
            font-size: 2rem;
            text-align: center;
        }
        main section h4 {
            background-color: #fff9;
            color: #0009;
            border-radius: 4px;
            text-align: center;
            font-size: 1.6rem;
            margin: 0 auto;
            padding: 0.4rem 1rem;
            width: fit-content;
        }

        main section figure {
            background-repeat: no-repeat;
            padding: 0;
            display: flex;
            justify-content: center;
            margin: 0 auto;
            height: 192px;
            width: 202px;
        }
        main section figure.alive {
            background-position-x: 0px;
        }
        main section figure.attack {
            background-position-x: -202px;
        }
        main section figure.feed {
            background-position-x: -404px;
        }
        main section figure.dead {
            background-position-x: -608px;
        }
        main section div.actions {
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            width: 150px;
            button {
                background: #fff9;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                padding: 0.4rem 1rem;
                transition: transform 0.2s ease-in;
                &:hover {
                    transform: scale(1.2);
                }
            }
        }
    </style>
</head>
<body>
    <main>
        <h1> 05_method </h1>
        <h2></h2>
        <section>
            <h3 class="pk-name"></h3>
            <h4 class="pk-hp"></h4>
            <figure class="pk-image animate__animated"></figure>
            <div class="actions">
                <button class="btn-attack">Attack</button>
                <button class="btn-feed">Feed</button>
            </div>
        </section>
    </main>

    <script>
        //elements
        const pkname = document.querySelector('.pk-name');
        const pkhp = document.querySelector('.pk-hp');
        const pkimage = document.querySelector('.pk-image');
        
        //btns
        const btnattack = document.querySelector('.btn-attack');
        const btnfeed = document.querySelector('.btn-feed');
        
        // object
        const pokemon = {
            //atributos
            name: 'snorlax',
            type: 'normal',
            hp: 100,
            Image: '/img.js/snorlax-sprite.png', // Ajusta la ruta correcta de tu imagen si es necesario
            status: 'alive',

            //methods
            render: function () {
                pkname.innerHTML = `${this.name}<small>[${this.type}]</small>`;
                pkimage.style.backgroundImage = `url(${this.Image})`;
            },

            updateHp: function(fx) {
                pkhp.innerHTML = `HP: ${this.hp}`;
                pkimage.classList.add(this.status, fx);
                this.updatestatus(fx); // Limpia la animación automáticamente
            },

            feed: function() {
                if (this.hp < 200) {
                    this.hp += 25;
                }
                this.status = 'feed';
                pkimage.classList.remove('alive', 'attack', 'dead'); // Corregido: 'attack' (antes 'attact')
                this.updateHp('animate__rubberBand');
            },

            updatestatus: function(fx) { // Corregido: ahora este método está DENTRO del objeto
                setTimeout(() => {
                    pkimage.classList.remove(fx);
                }, 1200);
            }
        };

        // Renderizado e inicialización
        pokemon.render();
        pokemon.updateHp('alive');

        //events
        btnfeed.addEventListener('click', function() { // Corregido: btnfeed.addEventListener (antes btn.feed.addventlistener)
            pokemon.feed();
        });
    </script>
</body>
</html>
