<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05_method</title>
    <link rel="stylesheet" href="css.js/animate.min.css">

    <style>
        main section h3.pk-name {
            font-size: 2rem;
            text-align: center;
        }
        main section h4 {
            background-color: #fff9;
            color: #0009;
            border-radius: 4px;
            text-align: center;
            font-size: 1.6rem;
            margin: 0 auto;
            padding: 0.4rem 1rem;
            width: fit-content;
        }

        main section figure {
            background-repeat: no-repeat;
            padding: 0;
            display: flex;
            justify-content: center;
            margin: 0 auto;
            height: 192px;
            width: 202px;
        }
        main section figure.alive {
            background-position-x: 0px;
        }
        main section figure.attack {
            background-position-x: -202px;
        }
        main section figure.feed {
            background-position-x: -404px;
        }
        main section figure.dead {
            background-position-x: -608px;
        }
        main section div.actions {
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            width: 150px;
            button {
                background: #fff9;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                padding: 0.4rem 1rem;
                transition: transform 0.2s ease-in;
                &:hover {
                    transform: scale(1.2);
                }
            }
        }
    </style>
</head>

<body>
    <main>
        <h1> 05_method </h1>
        <h2></h2>
        <section>
            <h3 class="pk-name"></h3>
            <h4 class="pk-hp"></h4>
            <figure class="pk-image animate__animated"></figure>
            <div class="actions">
                <button class="btn-attack">Attack</button>
                <button class="btn-feed">Feed</button>
            </div>
        </section>
    </main>

    <script>
        // elements
        const pkname = document.querySelector('.pk-name');
        const pkhp = document.querySelector('.pk-hp');
        const pkimage = document.querySelector('.pk-image');
        
        // btns
        const btnattack = document.querySelector('.btn-attack');
        const btnfeed = document.querySelector('.btn-feed');
        
        // object
        const pokemon = {
            // atributos
            name: 'snorlax',
            type: 'normal',
            hp: 100,
            Image: 'img.js/snorlax-sprite.png',
            status: 'alive',

            // methods
            render: function () {
                pkname.innerHTML = `${this.name} <small>[${this.type}]</small>`;
                pkimage.style.backgroundImage = `url(${this.Image})`;
                this.updateHp('');
            },

            updateHp: function (fx) {
                if (this.hp <= 0) {
                    this.hp = 0;
                    this.status = 'dead';
                }
                
                pkhp.innerHTML = `HP: ${this.hp}`;
                pkimage.className = `pk-image animate__animated ${this.status} ${fx}`;
            },

            attack: function () {
                if (this.status !== 'dead') {
                    this.hp -= 20;
                    this.status = 'attack';
                    this.updateHp('animate__headShake');
                }
            },

            feed: function () {
                if (this.status !== 'dead' && this.hp < 100) {
                    this.hp += 10;
                    if (this.hp > 100) this.hp = 100;
                    this.status = 'feed';
                    this.updateHp('animate__bounce');
                }
            }
        };

        // Inicializar render
        pokemon.render();

        // Eventos de los botones
        btnattack.addEventListener('click', () => pokemon.attack());
        btnfeed.addEventListener('click', () => pokemon.feed());
    </script>
</body>
</html>
