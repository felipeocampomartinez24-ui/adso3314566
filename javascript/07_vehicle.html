<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoLux - Vehicle Object</title>
     <a href="/javascript/index_javascript.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z">
            </path>
        </svg>
    </a>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        div.vehicle {
            width: 350px;
            background-color: #161b22;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: #ffffff;
            border: 1px solid #21262d;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* --- MODO CLARO --- */
        div.vehicle.light {
            background-color: #eaf0f6;
            color: #161b22;
            border-color: #cbd5e1;

            .logo-box, .btn-mode, .model-badge, .car-card {
                background-color: #ffffff;
                border-color: #cbd5e1;
                color: #161b22;
            }

            .nav-arrow {
                color: #161b22;
            }
        }

        /* --- HEADER --- */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            background-color: #0d1117;
            border-radius: 10px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            height: 50px;
            border: 1px solid #21262d;
        }

        .logo-box img {
            max-height: 35px;
            max-width: 100%;
            object-fit: contain;
        }

        .btn-mode {
            background-color: #0d1117;
            border: 1px solid #21262d;
            border-radius: 10px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn-mode img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .btn-mode:hover {
            transform: scale(1.05);
        }

        /* --- NAVEGADOR MODELOS --- */
        .model-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-arrow {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            padding: 4px 8px;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }

        .nav-arrow:hover {
            opacity: 0.7;
        }

        .model-badge {
            width: 120px;
            height: 38px;
            background-color: #0d1117;
            border: 1px solid #21262d;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        /* --- GALERÍA FERRARI --- */
        .car-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .car-card {
            background-color: #0d1117;
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            border: 1px solid #21262d;
            font-size: 0.65rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .car-card.active {
            border: 2px solid #0088ff;
            box-shadow: 0 0 10px rgba(0, 136, 255, 0.3);
        }

        .car-card img {
            width: 100%;
            height: 40px;
            object-fit: contain;
            margin-bottom: 4px;
        }

        /* --- ESCENARIO PRINCIPAL --- */
        .stage-container {
            position: relative;
            height: 190px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #21262d;
            background: linear-gradient(to bottom, #090e17 0%, #111c33 50%, #05070a 50%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 15px;
        }

        .stage-bg-city {
            position: absolute;
            top: 0;
            width: 100%;
            height: 110px;
            object-fit: cover;
            opacity: 0.85;
        }

        .stage-car {
            width: 140px;
            height: auto;
            object-fit: contain;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        /* --- BOTONERA DE CONTROL --- */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .btn-ctrl {
            border: none;
            border-radius: 6px;
            height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.6rem;
            font-weight: bold;
            cursor: pointer;
            gap: 2px;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        .btn-ctrl:active {
            transform: scale(0.95);
        }

        .btn-ctrl .icon {
            font-size: 0.85rem;
        }

        .btn-on { background-color: #2ed573; color: #ffffff; }
        .btn-forw { background-color: #1e90ff; color: #ffffff; }
        .btn-stop { background-color: #ff4757; color: #ffffff; }
        .btn-back { background-color: #eccc68; color: #000000; }
        .btn-off { background-color: #2f3542; color: #ffffff; }
    </style>
</head>

<body>

    <div class="vehicle" id="vehicleApp">

        <!-- 1. HEADER CON LOGO Y BOTÓN DE MODO -->
        <header class="header-top">
            <div class="logo-box">
                <img src="/imgs/logo_autolux.svg" alt="AutoLux">
            </div>
            <button class="btn-mode" id="btnMode" aria-label="Cambiar modo">
                <img src="/imgs/noche.svg" alt="Mode">
            </button>
        </header>

        <!-- 2. NAVEGACIÓN MODELOS -->
        <div class="model-selector">
            <button class="nav-arrow" id="btnPrev">&lt; PREV</button>
            <div class="model-badge" id="modelBadge">288 GTO</div>
            <button class="nav-arrow" id="btnNext">NEXT &gt;</button>
        </div>

        <!-- 3. MINIATURAS FERRARI -->
        <section class="car-gallery">
            <div class="car-card active" data-index="0">
                <img src="/imgs/ferrari_rojo.svg" alt="288 GTO">
                <span>288 GTO</span>
            </div>
            <div class="car-card" data-index="1">
                <img src="/imgs/ferrarri_azul.svg" alt="F40">
                <span>F40</span>
            </div>
            <div class="car-card" data-index="2">
                <img src="/imgs/ferrari_3.svg" alt="F50">
                <span>F50</span>
            </div>
        </section>

        <!-- 4. ESCENARIO CENTRAL -->
        <div class="stage-container">
            <img src="/imgs/image 10.svg" alt="Fondo Ciudad" class="stage-bg-city">
            <img src="/imgs/ferrari_rojo.svg" alt="Ferrari Principal" class="stage-car" id="mainCarDisplay">
        </div>

        <!-- 5. BOTONERA DE CONTROL -->
        <footer class="controls-grid">
            <button class="btn-ctrl btn-on" id="btnOn">
                <span>ON</span>
                <span class="icon">✓</span>
            </button>
            <button class="btn-ctrl btn-forw" id="btnForw">
                <span>FORW</span>
                <span class="icon"></span>
            </button>
            <button class="btn-ctrl btn-stop" id="btnStop">
                <span>STOP</span>
                <span class="icon">■</span>
            </button>
            <button class="btn-ctrl btn-back" id="btnBack">
                <span>BACK</span>
                <span class="icon"></span>
            </button>
            <button class="btn-ctrl btn-off" id="btnOff">
                <span>OFF</span>
                <span class="icon">✕</span>
            </button>
        </footer>

    </div>

    <!-- JAVASCRIPT: FUNCIONALIDAD DE NAVEGACIÓN DE MODELOS -->
    <script>
        const vehicleApp = document.getElementById('vehicleApp');
        const btnMode = document.getElementById('btnMode');
        
        // Elementos de navegación e interfaz
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const modelBadge = document.getElementById('modelBadge');
        const mainCarDisplay = document.getElementById('mainCarDisplay');
        const carCards = document.querySelectorAll('.car-card');

        // Base de datos de los modelos Ferrari solicitados
        const ferrariModels = [
            { name: "288 GTO", image: "/imgs/ferrari_rojo.svg" },
            { name: "F40", image: "/imgs/ferrari_rojo.svg" },
            { name: "F50", image: "/imgs/ferrari_3.svg" },
            { name: "Enzo", image: "/imgs/ferrari_rojo.svg" },
            { name: "LaFerrari", image: "/imgs/ferrari_rojo.svg" },
            { name: "F80", image: "/imgs/ferrari_3.svg" }
        ];

        let currentIndex = 0;

        // Función para actualizar la interfaz según el índice actual
        function updateVehicleDisplay() {
            const currentModel = ferrariModels[currentIndex];
            
            // Actualizar el texto del badge superior
            modelBadge.textContent = currentModel.name;
            
            // Actualizar la imagen central del escenario
            mainCarDisplay.src = currentModel.image;
            mainCarDisplay.alt = currentModel.name;

            // Opcional: Actualizar las 3 tarjetas de la galería visualmente si deseas reflejar un segmento
            // (Aquí puedes ajustar la lógica de las miniaturas según tus archivos específicos)
        }

        // Evento botón NEXT
        btnNext.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % ferrariModels.length; // Cicla al inicio si llega al final
            updateVehicleDisplay();
        });

        // Evento botón PREV
        btnPrev.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + ferrariModels.length) % ferrariModels.length; // Cicla al final si está en el inicio
            updateVehicleDisplay();
        });

        // Funcionalidad de Modo Claro / Oscuro
        btnMode.addEventListener('click', () => {
            vehicleApp.classList.toggle('light');
        });
    </script>
</body>

</html>
